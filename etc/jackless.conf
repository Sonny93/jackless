# Configuration de jackless (format CLE=VALEUR, guillemets doubles facultatifs).
# Ce fichier est lu ligne par ligne, jamais exécuté.

# Identifiant ALSA de la carte son (de préférence l'id, l'index change avec les DAC USB).
CARD=PCH

# Périphérique codec (ex. /dev/snd/hwC0D0). Vide : détection automatique.
DEVICE=""

# Broches des haut-parleurs à couper (ex. "0x14 0x17").
# Vide : détection automatique. Sur un Dell XPS (ALC289), l'auto trouve "0x14 0x17".
SPEAKER_PINS=""

# Contrôle ALSA du casque, réactivé à chaque coupure des haut-parleurs.
HEADPHONE_CONTROL=Headphone

# Sortie PipeWire à utiliser. Vide : sortie par défaut.
SINK=""

# Notifications de bureau : 1 pour les activer, 0 pour les couper.
NOTIFY=1
